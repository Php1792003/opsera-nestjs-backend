<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - AEGISM</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Sử dụng font Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'aegism-blue': '#2563EB', // Màu xanh dương từ hình
                        'aegism-dark': '#1F2937',
                        'aegism-dark-blue': '#111827', // Màu nền cột trái
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="m-4 w-full max-w-5xl bg-white rounded-2xl shadow-xl grid grid-cols-1 lg:grid-cols-2 overflow-hidden">
        
        <!-- Cột bên trái: Thông tin & Hình ảnh -->
        <div class="hidden lg:block relative p-12 bg-aegism-dark-blue text-white">
            <!-- Background Image Placeholder (gradient) -->
            <div class="absolute inset-0 w-full h-full object-cover opacity-30" 
                 style="background-image: linear-gradient(to bottom right, #6D28D9, #2563EB, #10B981); 
                        background-size: cover; 
                        background-position: center;
                        mask-image: linear-gradient(to bottom, white 60%, transparent 100%);">
            </div>
            
            <!-- Content -->
            <div class="relative z-10 flex flex-col justify-between h-full">
                <div>
                    <!-- Logo (đơn giản) -->
                    <span class="font-extrabold text-3xl">AEGISM</span>
                </div>
                <div class="mt-auto">
                    <h2 class="text-3xl font-bold">
                        AEGISM
                    </h2>
                    <p class="mt-3 text-lg text-gray-300 max-w-lg">
                        Nền tảng giám sát an ninh và tối ưu hóa vận hành thông minh.
                    </p>
                </div>
            </div>
        </div>

        <!-- Cột bên phải: Form đăng nhập -->
        <div class="flex flex-col justify-center py-12 px-4 sm:px-12 lg:px-16">
            <div class="mx-auto w-full max-w-md">
                
                <!-- Tiêu đề -->
                <h1 class="text-3xl font-extrabold text-aegism-dark">Đăng nhập vào AEGISM</h1>
                <p class="mt-2 text-base text-gray-600">
                    Tối ưu hóa vận hành, bảo mật tuyệt đối.
                </p>

                <!-- Form -->
                <form class="mt-8 space-y-6" action="#" method="POST" x-data="{ showPassword: false }">
                    <!-- Email hoặc Tên người dùng -->
                    <div>
                        <label for="email-username" class="block text-sm font-medium text-gray-700 mb-2">Email hoặc Tên người dùng</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <!-- Icon user -->
                                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input id="email-username" name="email-username" type="text" required
                                   placeholder="Nhập email hoặc tên người dùng"
                                   class="block w-full pl-10 px-4 py-3 bg-white border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-aegism-blue focus:border-transparent">
                        </div>
                    </div>

                    <!-- Mật khẩu -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="password" class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                            <a href="#" class="text-sm font-medium text-aegism-blue hover:text-blue-700">
                                Quên mật khẩu?
                            </a>
                        </div>
                        <div class="relative">
                             <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <!-- Icon khóa -->
                                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                  <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input id="password" name="password" :type="showPassword ? 'text' : 'password'" required
                                   placeholder="Nhập mật khẩu của bạn"
                                   class="block w-full pl-10 px-4 py-3 bg-white border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-aegism-blue focus:border-transparent">
                            
                            <!-- Nút JS để hiện/ẩn mật khẩu -->
                            <button type="button" @click="showPassword = !showPassword"
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 text-gray-500 hover:text-aegism-dark focus:outline-none">
                                <!-- Icon mắt (đang đóng) -->
                                <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <!-- Icon mắt (đang mở) -->
                                <svg x-show="showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display: none;">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.996 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.575M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Nút Submit -->
                    <div>
                        <button type="submit"
                                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-aegism-blue hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-aegism-blue">
                            Đăng nhập
                        </button>
                    </div>
                </form>

                <!-- Link Đăng ký -->
                <p class="mt-10 text-center text-sm text-gray-600">
                    Bạn mới biết đến AEGISM?
                    <a href="aegism_signup_page.html" class="font-medium text-aegism-blue hover:text-blue-700">
                        Tạo tài khoản
                    </a>
                </p>
            </div>
        </div>

    </div>

</body>
</html>
